name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: pack smoke test
        shell: bash
        run: |
          pack_file="$(npm pack --silent)"
          tar -tf "$pack_file" | sort
          tar -tf "$pack_file" | grep -q 'package/dist/index.js'
          tar -tf "$pack_file" | grep -q 'package/dist/web/app.html'
          if tar -tf "$pack_file" | grep -q 'package/src/'; then
            echo "unexpected source files present in tarball"
            exit 1
          fi
          if tar -tf "$pack_file" | grep -q 'bun.lock'; then
            echo "unexpected bun artifact present in tarball"
            exit 1
          fi
